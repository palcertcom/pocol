name: Full nonce consensus upgrade
on:
  pull_request:
    branches: [main, work/branding-20261031]
    paths: ['prototypes/**', 'deploy/standalone/**', 'deploy/rewards/**', 'deploy/mainnet/**', 'deploy/public-testnet/**', 'deploy/studio/**', 'deploy/faucet/**', 'README.md', '.github/workflows/full-nonce-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consensus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test profiles, activation, persistence and native binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --manifest-path prototypes/lp1-node/Cargo.toml --test profile --test gate --test assignment
          cargo +1.99.1 test --locked --manifest-path prototypes/lp4-execution/Cargo.toml --test profile_execution
          cargo +1.99.1 test --locked --release --manifest-path prototypes/pocold/Cargo.toml --lib --test full_nonce --test fork_configuration
          cargo +1.99.1 build --locked --release --bins --manifest-path prototypes/pocold/Cargo.toml
          python deploy/standalone/test_launcher.py -v
          python deploy/standalone/test_upgrade.py -v
          python -m unittest discover -s deploy/standalone -p test_prepare_nonce_upgrade.py -v
          python -m unittest discover -s deploy/rewards -v
      - name: Test stopped seed migration, mainnet preflight and cutover tools, Studio gateway and faucet
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s deploy/public-testnet -p test_nonce_upgrade.py -v
          python3 -B -m unittest discover -s deploy/mainnet -p 'test_*.py' -v
          # The cutover on a local Mainnet-shaped network, 60+ blocks below the stopped head as in the runbook.
          python3 -B deploy/mainnet/rehearse_cutover.py --local --work "$RUNNER_TEMP/pocol-rehearsal"
          python3 -B -m unittest discover -s deploy/studio -v
          python3 -B -m unittest discover -s deploy/faucet -v
      - name: Keep the cutover rehearsal's node logs when it fails
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cutover-rehearsal-logs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pocol-rehearsal/*.log
          if-no-files-found: ignore
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Linux wallet export dependency
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Verify complete Studio, IDE and Viewer release
        run: |
          npm ci --ignore-scripts
          npm test
          npm run test:studio
          npm run test:publisher
          npm run test:contracts
          npm run test:contract-ui
          /usr/bin/python3 -m unittest tests/test_linux_export.py -v
          npm run package
        working-directory: prototypes/pocol-extension
      - name: Verify Studio
        run: |
          npm test
          npm run check
        working-directory: prototypes/pocol-studio
      - name: Upload extension release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocol-extension-${{ github.sha }}
          path: prototypes/pocol-extension/releases/*
          if-no-files-found: error
