name: Native five-device testnet packages
on:
  pull_request:
    branches: [main, codex/public-network-operations]
    paths: ['prototypes/**', 'deploy/standalone/**', '.github/workflows/five-device-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve identical source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Validate Windows setup script syntax without accessing any server
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/standalone/Initialize-PoColNetwork.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax errors' }
      - name: Keep the Windows package independent of the Visual C++ redistributable
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build native binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --release --bins --manifest-path prototypes/pocold/Cargo.toml
          cargo +1.99.1 test --locked --release --lib --test net --manifest-path prototypes/pocold/Cargo.toml
          python deploy/standalone/test_launcher.py -v
          python deploy/standalone/test_launcher.py --integration
      - name: Package explicit public allowlist
        shell: bash
        run: python deploy/standalone/package.py --platform "${{ runner.os }}" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocol-${{ runner.os }}-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          persist-credentials: false
      - name: Set up fixed toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          curl --fail --location --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          curl --fail --location --output "$RUNNER_TEMP/gradle.sha256" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Build actual ARM64 engine and APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash deploy/standalone/build-android.sh
          python deploy/standalone/package.py --platform Android --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pocol-Android-arm64-${{ env.EXPECTED_COMMIT }}
          path: dist/
          retention-days: 30
