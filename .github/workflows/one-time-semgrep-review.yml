name: One-time PoCol Semgrep security review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-semgrep-review.yml'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep Community Edition
        run: python -m pip install 'semgrep==1.168.0'
      - name: Scan first-party source and deployment scripts
        run: |
          semgrep scan --config p/security-audit --config p/rust --metrics off --json --output semgrep-results.json \
            --exclude '**/evidence/**' --exclude '**/dist/**' \
            --exclude '**/assets/**' --exclude '**/node_modules/**' \
            --exclude '**/target/**' .
      - name: Preserve findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semgrep-pocol-findings
          path: semgrep-results.json
          if-no-files-found: warn
          retention-days: 14
