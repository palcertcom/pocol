[package]
name = "pocol-lp4-execution"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
revm = { version = "=19.7.0", features = ["serde"] }
serde_json = "=1.0.145"
# RUSTSEC-2026-0387: signing and public recovery share the corrected stack.
k256 = { version = "=0.14.0", features = ["ecdsa"] }
# Security floor: 0.14.3 requires crypto-bigint >=0.7.8, including the timing fixes.
# The committed locks select the non-yanked 0.7.10 release.
elliptic-curve = { version = "=0.14.3", default-features = false }
sha2 = "=0.10.9"

[dev-dependencies]
# Independent RFC6979 oracle, already locked through revm's public precompile.
secp256k1 = { version = "=0.29.1", features = ["recovery"] }

[features]
# validation.md:2065: the caps-test build constant LOG_CAP=2^24 (simnet only, absent from the release).
# Never a default. The same line's HIST_TRIE_BUDGET=64 MiB is not set: pocold has no historical trie or
# K_eff (T18b L12/L13), so it would only change the R21 admission arithmetic.
caps-test = []
# C-1 E1: compare every incremental state root with the full computation (pocold's tests). Never a default.
root-check = []

[patch.crates-io]
# Documented, locally maintained compatibility patches; EVM engine stays 19.7.0.
alloy-primitives = { path = "../third-party/evm-crypto/alloy-primitives-0.8.26" }
alloy-eip7702 = { path = "../third-party/evm-crypto/alloy-eip7702-0.5.1" }
revm-precompile = { path = "../third-party/evm-crypto/revm-precompile-16.2.0" }
